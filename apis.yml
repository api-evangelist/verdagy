aid: verdagy
name: Verdagy
description: 'Verdagy is a Moss Landing, California clean-energy hardware company that
  designs and manufactures dynamic alkaline water electrolysis systems for large-scale
  green hydrogen production. Its eDynamic platform runs very large-area membrane-based
  electrochemical cells at high current density with dynamic turndown, so electrolyzers
  can follow intermittent renewable power, targeting fossil-fuel cost parity for clean
  hydrogen by 2028 without subsidies. The company operates a 2 MW eDynamic demonstration
  plant at Moss Landing with more than 21,000 commercial cell hours, plus 500 kW and
  100 kW test plants, and opened a DOE-supported gigawatt-scale manufacturing facility
  of more than 100,000 square feet in Newark, California. Verdagy sells electrolyzer
  hardware and project capacity to industrial hydrogen buyers — refining, ammonia,
  methanol, e-fuels and SAF — rather than software; it publishes no developer program,
  no public API, and no machine-readable API contract.'
